<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit & Task Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #37352f; overflow-x: hidden; }
        
        .notion-checkbox {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 1.5px solid #d1d5db;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 2px;
        }
        .notion-checkbox:checked {
            background-color: #37352f;
            border-color: #37352f;
        }
        .notion-checkbox:checked::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: white;
            font-size: 11px;
        }

        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .notion-input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background-color: rgba(247, 247, 245, 0.7);
            border: 1px solid transparent;
            border-radius: 6px;
            outline: none;
            transition: all 0.2s;
        }
        .notion-input:focus { border-color: #d1d5db; background-color: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

        .banner-fallback {
            background: linear-gradient(135deg, #1a1a1a 0%, #37352f 100%);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col" id="app-container">

    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 -translate-y-24 opacity-0 transition-all duration-300 bg-gray-800 text-white px-6 py-3 rounded-full shadow-2xl flex items-center space-x-3 z-[100] pointer-events-none">
        <i id="toast-icon" class="fa-solid fa-circle-info"></i>
        <span id="toast-msg" class="font-medium whitespace-nowrap"></span>
    </div>

    <div id="edit-modal" class="fixed inset-0 bg-black/20 backdrop-blur-sm hidden items-center justify-center z-50 fade-in">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md mx-4 border border-gray-100">
            <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center"><i class="fa-solid fa-pen mr-2 text-gray-400"></i> Edit Item</h3>
            <input type="hidden" id="edit-id">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Title</label>
                    <input type="text" id="edit-title" class="notion-input border-gray-200">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Description</label>
                    <textarea id="edit-description" rows="3" class="notion-input border-gray-200"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Type</label>
                    <select id="edit-type" class="notion-input border-gray-200">
                        <option value="todo">To-Do</option>
                        <option value="habit">Habit</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-3 mt-6 pt-4 border-t border-gray-100">
                    <button onclick="closeEditModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition text-sm font-medium">Cancel</button>
                    <button onclick="saveEdit()" class="px-4 py-2 bg-[#37352f] text-white rounded-lg hover:bg-black transition text-sm font-medium">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <main id="main-view" class="flex-1 w-full flex flex-col"></main>

    <script>
        let currentUser = null;
        let tasks = [];
        let useMockBackend = true; // Defaulting to true for preview stability

        const mockDB = {
            init: () => {
                if(!localStorage.getItem('users')) {
                    localStorage.setItem('users', JSON.stringify([{id: 1, username: 'admin', password: 'adminpassword', role: 'admin'}]));
                }
                if(!localStorage.getItem('tasks')) {
                    localStorage.setItem('tasks', JSON.stringify([
                        {id: 101, user_id: 'guest', title: 'Morning Run', description: '30 mins at the park', type: 'habit', status: 'completed'},
                        {id: 102, user_id: 'guest', title: 'Complete Presentation', description: 'Design slides for meeting', type: 'todo', status: 'pending'}
                    ]));
                }
            },
            get: (key) => JSON.parse(localStorage.getItem(key)) || [],
            set: (key, val) => localStorage.setItem(key, JSON.stringify(val))
        };
        mockDB.init();

        async function apiCall(action, payload = {}) {
            if (useMockBackend) return handleMockRequest(action, payload);
            try {
                const response = await fetch('api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, ...payload })
                });
                if (!response.ok) throw new Error('Server error');
                return await response.json();
            } catch (error) {
                useMockBackend = true;
                return handleMockRequest(action, payload);
            }
        }

        const container = document.getElementById('main-view');

        function renderAuth() {
            container.innerHTML = `
                <div class="flex-1 flex items-center justify-center bg-[#f7f7f5] p-4 fade-in">
                    <div class="max-w-md w-full bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
                        <div class="text-center mb-8">
                            <div class="w-14 h-14 bg-gray-800 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg transform -rotate-3">
                                <i class="fa-solid fa-layer-group text-white text-xl"></i>
                            </div>
                            <h2 class="text-2xl font-extrabold text-gray-800" id="auth-title">Log in</h2>
                        </div>
                        
                        <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Username</label>
                                <input type="text" id="username" required class="notion-input border-gray-200" placeholder="Username">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Password</label>
                                <input type="password" id="password" required class="notion-input border-gray-200" placeholder="••••••••">
                            </div>
                            <button type="submit" class="w-full bg-[#37352f] hover:bg-black text-white font-bold py-3 rounded-xl transition duration-200 mt-2 flex justify-center items-center shadow-lg shadow-gray-200">
                                <span id="auth-btn-text">Continue</span>
                            </button>
                        </form>

                        <div class="relative my-8">
                            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-100"></div></div>
                            <div class="relative flex justify-center text-xs"><span class="px-3 bg-white text-gray-400 font-medium">OR</span></div>
                        </div>

                        <button onclick="loginAsGuest()" type="button" class="w-full bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-bold py-3 rounded-xl transition duration-200 flex justify-center items-center shadow-sm mb-4">
                            <i class="fa-regular fa-user mr-2"></i> Continue as Guest
                        </button>
                        
                        <div class="mt-6 text-center text-sm">
                            <span id="auth-switch-text" class="text-gray-500">Don't have an account?</span> 
                            <button onclick="toggleAuthMode()" type="button" class="text-gray-800 font-bold hover:underline ml-1"><span id="auth-switch-btn">Sign up</span></button>
                        </div>
                    </div>
                </div>
            `;
        }

        function loginAsGuest() {
            currentUser = { id: 'guest', username: 'Guest', role: 'user' };
            showToast("Logged in as Guest", "success");
            initDashboard();
        }

        function toggleAuthMode() {
            const isLogin = document.getElementById('auth-title').innerText === 'Log in';
            document.getElementById('auth-title').innerText = isLogin ? 'Sign up' : 'Log in';
            document.getElementById('auth-switch-text').innerText = isLogin ? "Already have an account?" : "Don't have an account?";
            document.getElementById('auth-switch-btn').innerText = isLogin ? 'Log in' : 'Sign up'; 
        }

        async function handleAuth(e) {
            e.preventDefault();
            const btn = document.querySelector('button[type="submit"]');
            const btnText = document.getElementById('auth-btn-text');
            btn.disabled = true;
            btnText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            
            try {
                const u = document.getElementById('username').value.trim();
                const p = document.getElementById('password').value.trim();
                const isLoginMode = document.getElementById('auth-title').innerText === 'Log in';
                const action = isLoginMode ? 'login' : 'register';
                const res = await apiCall(action, { username: u, password: p });
                
                if (res && res.success) {
                    currentUser = res.user;
                    showToast(res.message || "Welcome back!", 'success');
                    setTimeout(() => initDashboard(), 300);
                } else {
                    showToast(res.message || "Error during authentication", 'error');
                }
            } finally {
                if (document.getElementById('auth-btn-text')) {
                    btn.disabled = false;
                    document.getElementById('auth-btn-text').innerText = "Continue";
                }
            }
        }

        function logout() {
            currentUser = null;
            tasks = [];
            showToast('Logged out successfully', 'info');
            renderAuth();
        }

        async function initDashboard() {
            await fetchTasks();
            renderUserDashboard();
        }

        async function fetchTasks() {
            const res = await apiCall('get_tasks');
            if (res.success) tasks = res.data || [];
        }

        function handleImageError(img) {
            img.style.display = 'none';
            img.parentElement.classList.add('banner-fallback');
        }

        function renderUserDashboard() {
            container.innerHTML = `
                <div class="fade-in pb-20 relative bg-white min-h-screen">
                    <div class="h-40 w-full relative overflow-hidden bg-gray-900">
                        <img src="sneakers-template-design_23-2151802956.jpg" 
                             alt="Banner" 
                             class="w-full h-full object-cover opacity-80"
                             onerror="handleImageError(this)">
                        <div class="absolute inset-0 bg-gradient-to-b from-black/20 to-transparent"></div>
                        
                        <div class="absolute top-4 right-6 flex items-center space-x-3">
                            <span class="text-white text-[10px] font-bold bg-black/40 backdrop-blur-md px-3 py-1 rounded-full uppercase tracking-widest border border-white/10">
                                <i class="fa-solid fa-circle text-[6px] text-green-400 mr-1.5 align-middle"></i> ${currentUser.username}
                            </span>
                            <button onclick="logout()" class="bg-white/90 backdrop-blur-sm text-gray-800 hover:text-red-600 px-3 py-1 rounded-lg text-[10px] font-bold shadow-lg transition">
                                Logout
                            </button>
                        </div>
                    </div>

                    <div class="max-w-5xl mx-auto px-6 sm:px-10 relative z-10 -mt-8">
                        <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-lg shadow-gray-200/40 mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 bg-[#37352f] rounded-lg flex items-center justify-center shadow-md">
                                    <i class="fa-solid fa-check-double text-white text-sm"></i>
                                </div>
                                <div>
                                    <h1 class="text-xl font-black text-[#37352f] tracking-tight leading-tight">To-Do & Habit Tracker</h1>
                                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-[0.1em]">${currentUser.username}'s workspace</p>
                                </div>
                            </div>
                            <div class="flex items-center">
                                <span class="bg-[#f7f7f5] text-gray-500 text-[9px] font-bold px-2 py-0.5 rounded-md uppercase border border-gray-100">
                                    ${tasks.length} items
                                </span>
                            </div>
                        </div>

                        <div class="flex flex-col md:flex-row gap-6">
                            <div class="w-full md:w-1/3">
                                <div class="sticky top-6">
                                    <h3 class="font-black text-gray-800 mb-3 flex items-center text-[9px] uppercase tracking-[0.2em] ml-1">
                                        <i class="fa-solid fa-plus text-gray-400 mr-2"></i> New Entry
                                    </h3>
                                    <form onsubmit="addTask(event)" class="space-y-3 bg-[#f7f7f5]/50 p-4 rounded-xl border border-gray-100">
                                        <input type="text" id="new-title" required class="notion-input text-sm" placeholder="What needs to be done?">
                                        <textarea id="new-desc" rows="2" class="notion-input text-xs" placeholder="Add some context..."></textarea>
                                        <select id="new-type" class="notion-input text-xs text-gray-600 font-bold">
                                            <option value="todo">🎯 To-Do Task</option>
                                            <option value="habit">🔄 Daily Habit</option>
                                        </select>
                                        <button type="submit" class="w-full bg-[#37352f] hover:bg-black text-white font-bold py-2.5 rounded-lg transition shadow-md text-[10px] uppercase tracking-widest mt-1">
                                            Add to List
                                        </button>
                                    </form>
                                </div>
                            </div>

                            <div class="w-full md:w-2/3">
                                <div class="flex items-center space-x-2 mb-6">
                                    <div class="relative flex-1">
                                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                                        <input type="text" id="search-input" onkeyup="renderTaskList()" placeholder="Filter..." class="w-full pl-8 pr-3 py-1.5 bg-gray-50/80 border border-transparent rounded-lg text-xs focus:bg-white focus:border-gray-200 outline-none transition">
                                    </div>
                                    <select id="filter-status" onchange="renderTaskList()" class="py-1.5 px-2 bg-gray-50 border border-transparent rounded-lg text-[10px] text-gray-500 font-bold outline-none focus:bg-white transition">
                                        <option value="all">All</option>
                                        <option value="pending">Pending</option>
                                        <option value="completed">Done</option>
                                    </select>
                                </div>

                                <div id="task-list" class="space-y-1.5"></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            renderTaskList();
        }

        function renderTaskList() {
            const listEl = document.getElementById('task-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            const filterStatus = document.getElementById('filter-status').value;

            const filtered = tasks.filter(t => {
                const matchSearch = t.title.toLowerCase().includes(search) || (t.description && t.description.toLowerCase().includes(search));
                const matchStatus = filterStatus === 'all' || t.status === filterStatus;
                return matchSearch && matchStatus;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center text-gray-400 py-16 text-xs italic">No items found.</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(t => {
                const isCompleted = t.status === 'completed';
                const typeColor = t.type === 'habit' ? 'text-blue-500 bg-blue-50/50 border-blue-100' : 'text-orange-500 bg-orange-50/50 border-orange-100';
                
                return `
                <div class="group flex items-start p-3 hover:bg-[#f7f7f5] rounded-xl transition duration-200 border border-transparent hover:border-gray-100 ${isCompleted ? 'opacity-50' : ''}">
                    <input type="checkbox" class="notion-checkbox mt-1 shadow-sm" ${isCompleted ? 'checked' : ''} onchange="toggleStatus(${t.id}, '${t.status}')">
                    
                    <div class="ml-3 flex-1 min-w-0">
                        <div class="flex items-center flex-wrap gap-2">
                            <span class="font-bold text-[14px] ${isCompleted ? 'line-through text-gray-400' : 'text-gray-800'} truncate">${t.title}</span>
                            <span class="px-1.5 py-0.5 rounded text-[8px] uppercase font-black border tracking-wider ${typeColor}">${t.type}</span>
                        </div>
                        ${t.description ? `<p class="text-[11px] text-gray-500 mt-0.5 leading-relaxed">${t.description}</p>` : ''}
                    </div>
                    
                    <div class="opacity-0 group-hover:opacity-100 transition-opacity flex space-x-1 ml-2">
                        <button onclick="openEditModal(${t.id})" class="p-1.5 text-gray-400 hover:text-gray-800 rounded-lg transition"><i class="fa-solid fa-pen text-[9px]"></i></button>
                        <button onclick="deleteTask(${t.id})" class="p-1.5 text-gray-400 hover:text-red-500 rounded-lg transition"><i class="fa-solid fa-trash text-[9px]"></i></button>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function addTask(e) {
            e.preventDefault();
            const data = {
                title: document.getElementById('new-title').value,
                description: document.getElementById('new-desc').value,
                type: document.getElementById('new-type').value
            };
            const res = await apiCall('add_task', data);
            if (res.success) {
                showToast('Item added', 'success');
                e.target.reset();
                await fetchTasks();
                renderTaskList();
            }
        }

        async function toggleStatus(id, currentStatus) {
            const task = tasks.find(t => t.id === id);
            const newStatus = currentStatus === 'pending' ? 'completed' : 'pending';
            await apiCall('update_task', { ...task, status: newStatus });
            await fetchTasks();
            renderTaskList();
        }

        async function deleteTask(id) {
            const res = await apiCall('delete_task', { id });
            if(res.success) {
                showToast('Deleted', 'info');
                await fetchTasks();
                renderTaskList();
            }
        }

        function openEditModal(id) {
            const task = tasks.find(t => t.id === id);
            document.getElementById('edit-id').value = task.id;
            document.getElementById('edit-title').value = task.title;
            document.getElementById('edit-description').value = task.description || '';
            document.getElementById('edit-type').value = task.type;
            document.getElementById('edit-modal').classList.replace('hidden', 'flex');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.replace('flex', 'hidden');
        }

        async function saveEdit() {
            const id = parseInt(document.getElementById('edit-id').value);
            const task = tasks.find(t => t.id === id);
            const updated = {
                ...task,
                title: document.getElementById('edit-title').value,
                description: document.getElementById('edit-description').value,
                type: document.getElementById('edit-type').value
            };
            const res = await apiCall('update_task', updated);
            if(res.success) {
                closeEditModal();
                showToast('Saved', 'success');
                await fetchTasks();
                renderTaskList();
            }
        }

        function showToast(msg, type = 'info') {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            const icon = document.getElementById('toast-icon');
            t.className = `fixed top-5 left-1/2 transform -translate-x-1/2 transition-all duration-300 px-6 py-3 rounded-full shadow-2xl flex items-center space-x-3 z-[100] translate-y-0 opacity-100 ${type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-[#37352f]' : 'bg-gray-800'} text-white`;
            icon.className = type === 'success' ? 'fa-solid fa-check-circle' : 'fa-solid fa-circle-info';
            setTimeout(() => { t.classList.add('-translate-y-24', 'opacity-0'); }, 3000);
        }

        function handleMockRequest(action, data) {
            return new Promise(resolve => {
                setTimeout(() => {
                    let users = mockDB.get('users');
                    let allTasks = mockDB.get('tasks');
                    switch(action) {
                        case 'register':
                            const exists = users.find(x => x.username === data.username);
                            if (exists) return resolve({success: false, message: 'Username taken'});
                            const newUser = {id: Date.now(), ...data, role: 'user'};
                            users.push(newUser);
                            mockDB.set('users', users);
                            resolve({success: true, user: newUser, message: 'Account created!'});
                            break;
                        case 'login':
                            const u = users.find(x => x.username === data.username);
                            if (u) resolve({success: true, user: u, message: 'Welcome back!'});
                            else {
                                // For ease of use in demo, auto-create if not exists
                                const temp = {id: Date.now(), username: data.username, role: 'user'};
                                users.push(temp);
                                mockDB.set('users', users);
                                resolve({success: true, user: temp, message: 'Logged in as new user'});
                            }
                            break;
                        case 'get_tasks':
                            resolve({success: true, data: allTasks.filter(t => t.user_id === (currentUser ? currentUser.id : 'guest'))});
                            break;
                        case 'add_task':
                            allTasks.unshift({id: Date.now(), user_id: currentUser ? currentUser.id : 'guest', ...data, status: 'pending'});
                            mockDB.set('tasks', allTasks); resolve({success: true});
                            break;
                        case 'update_task':
                            const idx = allTasks.findIndex(t => t.id === data.id);
                            if(idx>-1) allTasks[idx] = data;
                            mockDB.set('tasks', allTasks); resolve({success: true});
                            break;
                        case 'delete_task':
                            mockDB.set('tasks', allTasks.filter(t => t.id !== data.id)); resolve({success: true});
                            break;
                        default: resolve({success: true});
                    }
                }, 150);
            });
        }

        renderAuth();
    </script>
</body>
</html>
